version: '3.7'

services:
  minio:
    image: quay.io/minio/minio:latest
    env_file: 
      - ./services/minio/.env
    volumes:
      - ./minio_data:/data                  # Local directory for persistent data storage
    ports:
      - "9001:9001"                         # MinIO console port
    command: server /data --console-address ":9001"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 5

  mempool_fetcher:
    build:
      context: .
      dockerfile: ./services/mempool_fetcher/Dockerfile
    env_file: 
      - ./services/mempool_fetcher/.env
      - ./services/minio/.env
    depends_on:
      - minio
    # restart: unless-stopped

  duckdb_querier:
    build:
      context: .
      dockerfile: ./services/duckdb_querier/Dockerfile
    env_file: 
      - ./services/duckdb_querier/.env
      - ./services/minio/.env
    depends_on:
      - minio
    # restart: unless-stopped

  api_backend:
    build: 
      context: .
      dockerfile: ./services/api_backend/Dockerfile
    env_file: 
      - ./services/api_backend/.env
      - ./services/minio/.env
    ports:
      - "8000:8000"
    depends_on:
      - minio

  api_client:
    build: 
      context: .
      dockerfile: ./services/api_client/Dockerfile
    env_file: 
      - ./services/api_client/.env
    command: ["sh", "-c", "sleep 5 && python main.py"]
    depends_on:
      - api_backend


volumes:
  minio_data:
    driver: local