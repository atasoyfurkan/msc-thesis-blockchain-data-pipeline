services:
  minio:
    image: quay.io/minio/minio:latest
    env_file: 
      - ./services/minio_config/.env
    volumes:
      - ./minio_data:/data                  # Local directory for persistent data storage
    ports:
      - "9001:9001"                         # MinIO console port
    command: server /data --console-address ":9001"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 5

  mempool_fetcher:
    build:
      context: .
      dockerfile: ./services/fetchers/mempool_fetcher/Dockerfile
    env_file: 
      - ./services/fetchers/mempool_fetcher/.env
      - ./services/minio_config/.env
      - ./services/ethereum_node_config/.env
    depends_on:
      - minio
    restart: unless-stopped

  block_fetcher:
    build:
      context: .
      dockerfile: ./services/fetchers/block_fetcher/Dockerfile
    env_file: 
      - ./services/fetchers/block_fetcher/.env
      - ./services/minio_config/.env
      - ./services/ethereum_node_config/.env
    depends_on:
      - minio
    restart: unless-stopped

  transfer_event_fetcher:
    build:
      context: .
      dockerfile: ./services/fetchers/transfer_event_fetcher/Dockerfile
    env_file: 
      - ./services/fetchers/transfer_event_fetcher/.env
      - ./services/minio_config/.env
      - ./services/ethereum_node_config/.env
    depends_on:
      - minio
    restart: unless-stopped

  price_data_fetcher:
    build:
      context: .
      dockerfile: ./services/fetchers/price_data_fetcher/Dockerfile
    env_file: 
      - ./services/fetchers/price_data_fetcher/.env
      - ./services/minio_config/.env
    depends_on:
      - minio
    restart: unless-stopped

  api_backend:
    build: 
      context: .
      dockerfile: ./services/api_backend/Dockerfile
    env_file: 
      - ./services/api_backend/.env
      - ./services/minio_config/.env
    ports:
      - "8000:8000"
    depends_on:
      - minio

  api_client:
    build: 
      context: .
      dockerfile: ./services/api_client/Dockerfile
    env_file: 
      - ./services/api_client/.env
    command: ["sh", "-c", "sleep 5 && python main.py"]
    depends_on:
      - api_backend

  trade_researcher_simulator:
    build: 
      context: .
      dockerfile: ./services/simulators/trade_researcher_simulator/Dockerfile
    env_file: 
      - ./services/simulators/trade_researcher_simulator/.env
    command: ["sh", "-c", "sleep 5 && python main.py"]
    depends_on:
      - api_backend


volumes:
  minio_data:
    driver: local