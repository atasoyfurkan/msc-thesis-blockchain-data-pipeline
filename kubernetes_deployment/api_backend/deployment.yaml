apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-backend
  namespace: pipeline
  labels:
    app: api-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-backend
  template:
    metadata:
      labels:
        app: api-backend
    spec:
      containers:
      - name: api-backend
        image: atasoy/pipeline-api-backend:v1.12
        ports:
        - containerPort: 8000
        env:
          - name: LOGGING_LEVEL
            value: "INFO"
          - name: JUPYTERHUB_API_URL
            value: "https://hub.atasoyfurkan.live"
          - name: QUERY_TIMEOUT_SECONDS
            value: "300"
          - name: PERSISTENT_QUERY_RETENTION_DAYS
            value: "30"
          - name: MINIO_ENDPOINT
            valueFrom:
              configMapKeyRef:
                name: pipeline-env
                key: minio-endpoint
          - name: MINIO_ROOT_USER
            valueFrom:
              secretKeyRef:
                name: pipeline-secret
                key: minio-root-user
          - name: MINIO_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: pipeline-secret
                key: minio-root-password
        resources:
          requests:
            memory: 200Mi
            cpu: 100m         
          limits:
            memory: 24Gi
            cpu: 3500m         
        livenessProbe:
          httpGet:
            path: /
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3