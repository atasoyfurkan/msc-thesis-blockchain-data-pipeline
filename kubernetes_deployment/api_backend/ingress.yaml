apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-backend
  namespace: pipeline
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "420"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "420"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api-backend.pipeline.atasoyfurkan.live
    secretName: cluster-issuer-secret-api-backend
  rules:
  - host: api-backend.pipeline.atasoyfurkan.live
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: api-backend 
            port:
              number: 80 
