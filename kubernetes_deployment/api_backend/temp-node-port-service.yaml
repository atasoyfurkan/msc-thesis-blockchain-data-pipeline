apiVersion: v1
kind: Service
metadata:
  name: api-backend
  namespace: pipeline
spec:
  selector:
    app: api-backend
  ports:
    - protocol: TCP
      port: 80         # Port exposed by the service
      targetPort: 8000 # Port the service redirects traffic to in the pod
      nodePort: 30080  # Fixed port to expose on the node (optional, Kubernetes will assign one if omitted)
  type: NodePort       # Change the service type to NodePort