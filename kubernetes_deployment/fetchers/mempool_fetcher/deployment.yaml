apiVersion: apps/v1
kind: Deployment
metadata:
  name: mempool-fetcher
  namespace: pipeline
  labels:
    app: mempool-fetcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mempool-fetcher
  template:
    metadata:
      labels:
        app: mempool-fetcher
    spec:
      containers:
      - name: mempool-fetcher
        image: atasoy/pipeline-mempool-fetcher:v1.10
        env:
          - name: LOGGING_LEVEL
            value: "INFO"
          - name: NODE_WS_URL
            valueFrom:
              configMapKeyRef:
                name: pipeline-env
                key: ethereum-node-ws-url
          - name: NODE_HTTP_URL
            valueFrom:
              configMapKeyRef:
                name: pipeline-env
                key: ethereum-node-http-url
          - name: FETCH_DETAIL_BATCH_SIZE
            value: "10"
          - name: SAVE_BATCH_SIZE
            value: "1000"
          - name: MINIO_BUCKET
            value: "mempool-data"
          - name: MINIO_ENDPOINT
            valueFrom:
              configMapKeyRef:
                name: pipeline-env
                key: minio-endpoint
          - name: MINIO_ROOT_USER
            valueFrom:
              secretKeyRef:
                name: pipeline-secret
                key: minio-root-user
          - name: MINIO_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: pipeline-secret
                key: minio-root-password
          - name: PROMETHEUS_PUSHGATEWAY_URL
            valueFrom:
              configMapKeyRef:
                name: pipeline-env
                key: prometheus-pushgateway-url