apiVersion: apps/v1
kind: Deployment
metadata:
  name: transfer-event-fetcher
  namespace: pipeline
  labels:
    app: transfer-event-fetcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transfer-event-fetcher
  template:
    metadata:
      labels:
        app: transfer-event-fetcher
    spec:
      containers:
      - name: transfer-event-fetcher
        image: atasoy/pipeline-transfer-event-fetcher:v1.6
        env:
          - name: LOGGING_LEVEL
            value: "INFO"
          - name: NODE_WS_URL
            valueFrom:
              configMapKeyRef:
                name: pipeline-env
                key: ethereum-node-ws-url
          - name: NODE_HTTP_URL
            valueFrom:
              configMapKeyRef:
                name: pipeline-env
                key: ethereum-node-http-url
          - name: SAVE_BATCH_SIZE
            value: "300"
          - name: MINIO_BUCKET
            value: "transfer-event-data"
          - name: MINIO_ENDPOINT
            valueFrom:
              configMapKeyRef:
                name: pipeline-env
                key: minio-endpoint
          - name: MINIO_ROOT_USER
            valueFrom:
              secretKeyRef:
                name: pipeline-secret
                key: minio-root-user
          - name: MINIO_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: pipeline-secret
                key: minio-root-password
          - name: PROMETHEUS_PUSHGATEWAY_URL
            valueFrom:
              configMapKeyRef:
                name: pipeline-env
                key: prometheus_pushgateway_url