apiVersion: apps/v1
kind: Deployment
metadata:
  name: trade-researcher-simulator
  namespace: simulator
  labels:
    app: trade-researcher-simulator
spec:
  replicas: 10
  selector:
    matchLabels:
      app: trade-researcher-simulator
  template:
    metadata:
      labels:
        app: trade-researcher-simulator
    spec:
      containers:
      - name: trade-researcher-simulator
        image: atasoy/pipeline-trade-researcher-simulator:v1.2
        env:
          - name: LOGGING_LEVEL
            value: "INFO"
          - name: MEAN_INTERARRIVAL_TIME_SECONDS
            value: "600"
          - name: PIPELINE_API_BACKEND_URL
            valueFrom:
              configMapKeyRef:
                name: simulation-env
                key: pipeline-api-backend-endpoint
          - name: JUPYTERHUB_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: simulation-secret
                key: jupyterhub-api-token